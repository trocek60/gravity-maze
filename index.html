</style></head><body><main><header><div><h1>GRAVITY MAZE</h1><small>WERSJA 0.8 · 20 POZIOMÓW</small></div><div id="level">POZIOM 1 / 20</div></header><div id="status">Znajdź drogę — bez pośpiechu</div><div id="timer" style="color:#f4d48a;font-weight:800;font-variant-numeric:tabular-nums;font-size:20px">00:00.0</div><div id="stage"><canvas id="game" width="720" height="720" aria-label="Labirynt z toczącą się kulą"></canvas></div><div class="controls"><button id="restart" aria-label="Restart">⟳ RESTART</button></div><footer>Przesuwaj palcem wzdłuż dowolnej krawędzi planszy. Jeden gest = obrót o 90°. Czas startuje przy pierwszym ruchu.</footer></main><div id="overlay"><div class="modal"><h2 id="winTitle">Poziom ukończony!</h2><div id="stars">★★★</div><p id="winText"></p><button id="next">NASTĘPNY POZIOM →</button></div></div><script>

const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');const N=11,T=720/N,S=720;const saved=Number(localStorage.getItem('gm03_unlocked')||'0');let levelIndex=0,grid=[],ball={x:0,y:0,vx:0,vy:0},exit={x:0,y:0},angle=0,targetAngle=0,turns=0,won=false,settle=0,last=0,dragging=false,dragPointer=null,dragX=0,dragStartAngle=0,totalRotation=0,swipeTriggered=false,dragY=0;let unlocked=Math.min(levels.length-1,Math.max(0,saved));let startTime=null,elapsed=0,bestTimes={};try{bestTimes=JSON.parse(localStorage.getItem("gm_best_times")||"{}")}catch{}function formatTime(v){const m=Math.floor(v/60),sec=(v%60).toFixed(1).padStart(4,"0");return String(m).padStart(2,"0")+":"+sec}
function load(i){startTime=null;elapsed=0;document.getElementById("timer").textContent="00:00.0";levelIndex=i;grid=levels[i].map(r=>r.split(''));angle=0;targetAngle=0;turns=0;won=false;settle=0;dragging=false;dragPointer=null;totalRotation=0;swipeTriggered=false;for(let y=0;y<N;y++)for(let x=0;x<N;x++){if(grid[y][x]==='S'){ball={x:x+.5,y:y+.5,vx:0,vy:0};grid[y][x]='.'}if(grid[y][x]==='E'){exit={x:x+.5,y:y+.5};grid[y][x]='.'}}document.getElementById('level').textContent=`POZIOM ${i+1} / ${levels.length}`;document.getElementById('status').textContent=`Przesuń palcem wzdłuż dowolnej krawędzi planszy`;document.getElementById('overlay').classList.remove('show')}
// Gest po obwodzie: kierunek obrotu wynika z ruchu stycznego
// względem środka planszy (prawa strona w dół = obrót w prawo).
function turn(dir){
  if(won)return;
  if(startTime===null)startTime=performance.now();
  targetAngle+=dir*Math.PI/2;
  turns++;
  document.getElementById('status').textContent=`Obroty: ${turns} · Znajdź drogę do wyjścia`;
}
function gestureDirection(e,threshold){
  const rect=canvas.getBoundingClientRect();
  const cx=rect.left+rect.width/2,cy=rect.top+rect.height/2;
  const ax=dragX-cx,ay=dragY-cy;
  const bx=e.clientX-cx,by=e.clientY-cy;
  const dx=e.clientX-dragX,dy=e.clientY-dragY;
  const radius=Math.hypot(ax,ay);
  if(radius<Math.min(rect.width,rect.height)*.19||Math.hypot(dx,dy)<threshold)return 0;
  // Iloczyn wektorowy: dodatni oznacza ruch zgodny ze wskazówkami zegara.
  const cross=ax*by-ay*bx;
  const dot=ax*bx+ay*by;
  const delta=Math.atan2(cross,dot);
  if(Math.abs(delta)<.115)return 0;
  return delta>0?1:-1;
}
canvas.addEventListener('pointerdown',e=>{
  if(won||dragging)return;
  dragging=true;swipeTriggered=false;dragPointer=e.pointerId;
  dragX=e.clientX;dragY=e.clientY;
  canvas.setPointerCapture(e.pointerId);e.preventDefault();
});
canvas.addEventListener('pointermove',e=>{
  if(!dragging||e.pointerId!==dragPointer||swipeTriggered)return;
  const dir=gestureDirection(e,24);
  if(dir){turn(dir);swipeTriggered=true;}
  e.preventDefault();
});
function endDrag(e){
  if(e.pointerId!==dragPointer)return;
  if(!swipeTriggered&&!won){
    const dir=gestureDirection(e,24);
    if(dir)turn(dir);
  }
  dragging=false;dragPointer=null;swipeTriggered=false;
  try{canvas.releasePointerCapture(e.pointerId)}catch{}
  e.preventDefault();
}
canvas.addEventListener('pointerup',endDrag);
canvas.addEventListener('pointercancel',e=>{
  if(e.pointerId!==dragPointer)return;
  dragging=false;dragPointer=null;swipeTriggered=false;
});
function wall(x,y){return x<0||x>=N||y<0||y>=N||grid[y][x]==='#'}
function collide(){const r=.365;for(let k=0;k<3;k++){let changed=false;for(let y=Math.max(0,Math.floor(ball.y-r)-1);y<=Math.min(N-1,Math.ceil(ball.y+r));y++)for(let x=Math.max(0,Math.floor(ball.x-r)-1);x<=Math.min(N-1,Math.ceil(ball.x+r));x++){if(!wall(x,y))continue;const cx=Math.max(x,Math.min(ball.x,x+1)),cy=Math.max(y,Math.min(ball.y,y+1));let dx=ball.x-cx,dy=ball.y-cy,d2=dx*dx+dy*dy;if(d2>=r*r)continue;let d=Math.sqrt(d2),nx,ny;if(d<.00001){let sides=[{d:Math.abs(ball.x-x),nx:-1,ny:0},{d:Math.abs(x+1-ball.x),nx:1,ny:0},{d:Math.abs(ball.y-y),nx:0,ny:-1},{d:Math.abs(y+1-ball.y),nx:0,ny:1}].sort((a,b)=>a.d-b.d);nx=sides[0].nx;ny=sides[0].ny;d=0}else{nx=dx/d;ny=dy/d}const penetration=r-d;ball.x+=nx*penetration;ball.y+=ny*penetration;const vn=ball.vx*nx+ball.vy*ny;if(vn<0){ball.vx-=(1.04)*vn*nx;ball.vy-=(1.04)*vn*ny}changed=true}if(!changed)break}}
function update(dt){const diff=targetAngle-angle;angle+=diff*Math.min(1,dt*7);if(Math.abs(targetAngle-angle)<.0005)angle=targetAngle;const step=1/240;let n=Math.min(20,Math.ceil(dt/step)),h=Math.min(dt,.055)/n;for(let i=0;i<n;i++){// Gravity is fixed in screen space; board-local gravity rotates opposite to board.
const gx=Math.sin(angle),gy=Math.cos(angle);ball.vx+=gx*24*h;ball.vy+=gy*24*h;const drag=Math.exp(-2.0*h);ball.vx*=drag;ball.vy*=drag;const speed=Math.hypot(ball.vx,ball.vy),limit=8.5;if(speed>limit){ball.vx*=limit/speed;ball.vy*=limit/speed}ball.x+=ball.vx*h;ball.y+=ball.vy*h;collide();
if(!won&&Math.hypot(ball.x-exit.x,ball.y-exit.y)<.24&&Math.hypot(ball.vx,ball.vy)<.48&&Math.abs(targetAngle-angle)<.01){settle+=h;if(settle>.22){win();break}}else settle=0}}
function win(){won=true;elapsed=startTime===null?0:(performance.now()-startTime)/1000;

const stars=elapsed<=target3?3:elapsed<=target2?2:1;

document.getElementById('stars').textContent='★'.repeat(stars)+'☆'.repeat(3-stars);
document.getElementById('winText').textContent=`Czas: ${formatTime(elapsed)} · Rekord: ${formatTime(bestTimes[levelIndex])} · 3 ★ do ${formatTime(target3)} · 2 ★ do ${formatTime(target2)}.`;
document.getElementById('winTitle').textContent=levelIndex===levels.length-1?'Wszystkie poziomy ukończone!':'Poziom ukończony!';
document.getElementById('next').textContent=levelIndex===levels.length-1?'ZAGRAJ OD POCZĄTKU':'NASTĘPNY POZIOM →';
unlocked=Math.max(unlocked,Math.min(levels.length-1,levelIndex+1));
try{localStorage.setItem('gm03_unlocked',String(unlocked))}catch{}
document.getElementById('overlay').classList.add('show')}
function roundRect(x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r)}
function draw(){ctx.clearRect(0,0,S,S);const bg=ctx.createLinearGradient(0,0,S,S);bg.addColorStop(0,'#192d43');bg.addColorStop(1,'#0b1726');ctx.fillStyle=bg;roundRect(0,0,S,S,35);ctx.fill();ctx.save();ctx.translate(S/2,S/2);ctx.rotate(angle);ctx.translate(-S/2,-S/2);ctx.fillStyle='#101e2e';roundRect(8,8,704,704,24);ctx.fill();for(let y=0;y<N;y++)for(let x=0;x<N;x++){const px=x*T,py=y*T;if(grid[y][x]==='#'){const g=ctx.createLinearGradient(px,py,px+T,py+T);g.addColorStop(0,'#527b94');g.addColorStop(.55,'#30566f');g.addColorStop(1,'#1c3a53');ctx.fillStyle=g;roundRect(px+1,py+1,T-2,T-2,7);ctx.fill();ctx.strokeStyle='#80b1ca66';ctx.lineWidth=2;ctx.stroke();ctx.fillStyle='#9ad4e21c';roundRect(px+5,py+5,T-10,7,3);ctx.fill()}else{ctx.fillStyle=(x+y)%2===0?'#15293c':'#182d40';ctx.fillRect(px,py,T,T)}}const ex=exit.x*T,ey=exit.y*T;let glow=ctx.createRadialGradient(ex,ey,3,ex,ey,42);glow.addColorStop(0,'#7affbd99');glow.addColorStop(1,'#28db8c00');ctx.fillStyle=glow;ctx.fillRect(ex-45,ey-45,90,90);ctx.strokeStyle='#6cfab7';ctx.lineWidth=6;ctx.beginPath();ctx.arc(ex,ey,18,0,Math.PI*2);ctx.stroke();ctx.fillStyle='#6cfab7';ctx.font='bold 11px system-ui';ctx.textAlign='center';ctx.fillText('CEL',ex,ey+5);

function frame(t){if(!last)last=t;const dt=Math.min((t-last)/1000,.05);last=t;if(!won&&startTime!==null){elapsed=(performance.now()-startTime)/1000;document.getElementById("timer").textContent=formatTime(elapsed)}update(dt);draw();requestAnimationFrame(frame)}
